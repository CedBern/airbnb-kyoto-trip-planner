<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sobaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sobaBg)"/>
  <!-- Bamboo Soba Tray (Seiro) -->
  <rect x="70" y="70" width="260" height="260" rx="16" fill="#78350F" stroke="#451A03" stroke-width="6"/>
  <rect x="90" y="90" width="220" height="220" rx="8" fill="#D97706"/>
  <!-- Bamboo Mat Slats -->
  <g stroke="#92400E" stroke-width="3">
    <line x1="90" y1="120" x2="310" y2="120"/>
    <line x1="90" y1="150" x2="310" y2="150"/>
    <line x1="90" y1="180" x2="310" y2="180"/>
    <line x1="90" y1="210" x2="310" y2="210"/>
    <line x1="90" y1="240" x2="310" y2="240"/>
    <line x1="90" y1="270" x2="310" y2="270"/>
  </g>
  <!-- Soba Noodles Bunch -->
  <path d="M120,180 Q200,130 280,180 Q200,240 120,180" fill="#A8A29E" stroke="#78716C" stroke-width="8"/>
  <path d="M130,200 Q200,160 270,200" stroke="#57534E" stroke-width="4" fill="none"/>
  <!-- Nori Seaweed strips -->
  <rect x="180" y="160" width="40" height="10" fill="#1C1917" rx="2" transform="rotate(-10 200 165)"/>
  <rect x="190" y="175" width="35" height="8" fill="#1C1917" rx="2" transform="rotate(15 200 180)"/>
  <!-- Soba Dipping Cup -->
  <circle cx="310" cy="300" r="45" fill="#1E293B" stroke="#0F172A" stroke-width="4"/>
  <circle cx="310" cy="300" r="35" fill="#3B82F6" opacity="0.3"/>
  <text x="310" y="306" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">蕎麦</text>
</svg>