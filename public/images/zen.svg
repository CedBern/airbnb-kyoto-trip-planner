<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="zenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="60%" stop-color="#99F6E4"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="bamboo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#zenBg)"/>
  <!-- Bamboo Stalks -->
  <!-- Stalk 1 -->
  <g fill="url(#bamboo)">
    <rect x="40" y="-10" width="28" height="110" rx="4"/>
    <rect x="38" y="98" width="32" height="6" rx="2" fill="#042F2E"/>
    <rect x="40" y="106" width="28" height="120" rx="4"/>
    <rect x="38" y="224" width="32" height="6" rx="2" fill="#042F2E"/>
    <rect x="40" y="232" width="28" height="180" rx="4"/>
  </g>
  <!-- Stalk 2 -->
  <g fill="url(#bamboo)">
    <rect x="130" y="-10" width="36" height="140" rx="4"/>
    <rect x="127" y="128" width="42" height="7" rx="2" fill="#042F2E"/>
    <rect x="130" y="137" width="36" height="130" rx="4"/>
    <rect x="127" y="265" width="42" height="7" rx="2" fill="#042F2E"/>
    <rect x="130" y="274" width="36" height="140" rx="4"/>
  </g>
  <!-- Stalk 3 -->
  <g fill="url(#bamboo)">
    <rect x="290" y="-10" width="32" height="90" rx="4"/>
    <rect x="288" y="78" width="36" height="6" rx="2" fill="#042F2E"/>
    <rect x="290" y="86" width="32" height="150" rx="4"/>
    <rect x="288" y="234" width="36" height="6" rx="2" fill="#042F2E"/>
    <rect x="290" y="242" width="32" height="170" rx="4"/>
  </g>
  <!-- Bamboo Leaves -->
  <path d="M166,130 Q220,110 240,140 Q200,145 166,130 Z" fill="#0D9488"/>
  <path d="M166,135 Q230,140 250,175 Q210,165 166,135 Z" fill="#14B8A6"/>
  <path d="M68,100 Q120,70 140,105 Q100,115 68,100 Z" fill="#0F766E"/>
  <path d="M322,80 Q370,55 390,90 Q350,100 322,80 Z" fill="#0D9488"/>
  <!-- Zen Stone Garden Base -->
  <ellipse cx="220" cy="350" rx="90" ry="35" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <!-- Meditation Bell / Inso Circle -->
  <circle cx="200" cy="200" r="60" fill="none" stroke="#008489" stroke-width="8" stroke-dasharray="320 40" opacity="0.85"/>
  <text x="200" y="210" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0F766E" text-anchor="middle">禅</text>
</svg>