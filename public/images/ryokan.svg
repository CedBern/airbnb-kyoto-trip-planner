<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ryokanSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="70%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ryokanSky)"/>
  <!-- Arashiyama River (Oi River) -->
  <path d="M0,350 Q200,320 400,360 T800,340 L800,450 L0,450 Z" fill="#38BDF8" opacity="0.6"/>
  <!-- Mountain -->
  <path d="M0,280 Q300,120 600,260 T800,200 L800,450 L0,450 Z" fill="#047857" opacity="0.85"/>
  <path d="M100,300 Q450,160 800,240 L800,450 L0,450 Z" fill="#065F46" opacity="0.9"/>
  <!-- Ryokan Pavilion with Onsen -->
  <polygon points="160,210 640,210 680,240 120,240" fill="#1E293B"/>
  <rect x="180" y="240" width="440" height="120" fill="#FEF3C7"/>
  <g stroke="#92400E" stroke-width="4">
    <rect x="200" y="250" width="100" height="100" fill="#FFFFFF"/>
    <rect x="320" y="250" width="160" height="100" fill="#FEF9C3"/>
    <rect x="500" y="250" width="100" height="100" fill="#FFFFFF"/>
  </g>
  <!-- Hot Springs Steam Symbol -->
  <path d="M380,310 Q370,290 380,270" stroke="#0284C7" stroke-width="3" fill="none"/>
  <path d="M400,310 Q390,290 400,270" stroke="#0284C7" stroke-width="3" fill="none"/>
  <path d="M420,310 Q410,290 420,270" stroke="#0284C7" stroke-width="3" fill="none"/>
  <text x="400" y="235" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FF385C" text-anchor="middle">嵐山 温泉旅館</text>
</svg>